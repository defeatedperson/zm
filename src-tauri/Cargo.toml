[package]
name = "livepaper"
version = "0.2.7"
description = "幻梦桌面 - Windows 动态壁纸工具"
authors = ["defeatedperson"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "livepaper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Registry", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_Graphics_Dwm", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Storage_FileSystem", "Win32_System_WindowsProgramming"] }
tauri-plugin-dialog = "2.7.3"
jpeg-encoder = "0.6"
# 移除素材送回收站（Windows 走 IFileOperation）
trash = "5"

# 发布体积与性能：LTO + 单 codegen unit + 去符号表。
# 不设 panic = "abort"：transcode 的 catch_unwind 兜底依赖 unwind 语义
[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

